# Regras de alerta (regra 9) — config-as-code.
# Mudar um threshold = editar este ficheiro + `docker compose restart prometheus`
# (sem redeploy da app). Ver docs/deploy/alerting.md.
groups:
  - name: innova-app
    rules:
      # Réplica individual em baixo. Com 2+ réplicas a app continua a servir —
      # daí `warning` e não `critical` (ver AppAllReplicasDown para o total).
      - alert: AppReplicaDown
        expr: up{job="innova-app"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Réplica INNOVA em baixo ({{ $labels.instance }})'
          description: 'O scrape de {{ $labels.instance }}/metrics falha há mais de 2 minutos.'

      # A app está a correr sem redundância (só 1 de 2 réplicas de pé). Não há
      # downtime, mas a próxima falha é total — tratar como incidente.
      - alert: AppRunningDegraded
        expr: count(up{job="innova-app"} == 1) < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'App INNOVA sem redundância (réplicas de pé: {{ $value }})'
          description: 'Menos de 2 réplicas `app` saudáveis há 5 minutos — ponto único de falha temporário.'

      # Todas as réplicas em baixo = outage.
      - alert: AppAllReplicasDown
        expr: (count(up{job="innova-app"} == 1) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'App INNOVA em baixo (todas as réplicas)'
          description: 'Nenhuma réplica `app` responde ao scrape /metrics há mais de 1 minuto.'

      - alert: HighErrorRate
        expr: >
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Taxa de erros 5xx acima de 5%'
          description: 'Rácio de respostas 5xx superior a 5% nos últimos 5 minutos.'

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Latência HTTP p95 acima de 1s'
          description: 'p95 dos pedidos HTTP acima de 1s há 10 minutos.'

      - alert: SlowDbQueries
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(prisma_query_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Queries Prisma lentas (p95 > 500ms)'
          description: 'p95 das queries Prisma acima de 500ms há 10 minutos.'

      - alert: EventLoopLag
        expr: nodejs_eventloop_lag_p90_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Event loop com lag elevado'
          description: 'Lag p90 do event loop acima de 0.5s há 5 minutos.'

      - alert: HighMemory
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Heap acima de 90%'
          description: 'Heap V8 usado acima de 90% do total há 10 minutos.'

      - alert: LowCacheHitRate
        expr: >
          (
            sum(rate(cache_requests_total{result="hit"}[30m]))
              / sum(rate(cache_requests_total[30m])) < 0.5
          )
          and sum(rate(cache_requests_total[30m])) > 0.05
        for: 30m
        labels:
          severity: info
        annotations:
          summary: 'Hit rate do cache abaixo de 50%'
          description: 'Com tráfego mínimo, o hit rate do cache está abaixo de 50% há 30 minutos.'

      # ── Disco (node-exporter, B3-3) ────────────────────────────────────────
      - alert: DiskSpaceLow
        expr: >
          (
            node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          ) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Disco com menos de 15% livre'
          description: >
            Espaço livre em disco abaixo de 15% no VPS.
            Risco de backups diários ou WAL do Postgres falharem.

      - alert: DiskSpaceCritical
        expr: >
          (
            node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          ) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Disco com menos de 5% livre — risco imediato'
          description: >
            Menos de 5% de espaço livre. O Postgres pode falhar a escrever WAL
            e a app pode entrar em crash loop.

      # Dead-man's switch: dispara SEMPRE. O Alertmanager encaminha-o como
      # heartbeat para o healthchecks.io — se os pings pararem, o alerta vem de fora.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 'Watchdog (dead-man) — deve estar sempre a disparar'
          description: 'Se o healthchecks.io deixar de receber isto, o stack de monitorização morreu.'

  # ── Backup PostgreSQL ────────────────────────────────────────────────────
  # Métricas geradas por ops/backup/backup-metrics.sh (textfile collector)
  # node-exporter deve ter
  # --collector.textfile.directory=/textfile_collector (ver docker-compose.prod.yml).
  - name: innova-backup
    rules:
      # Alerta se o último pg_dump tiver mais de 26 horas (cron diário às 02:00)
      - alert: BackupTooOld
        expr: >
          (time() - innova_backup_last_success_timestamp_seconds) / 3600 > 26
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 'Backup pg_dump desactualizado'
          description: >
            O último backup pg_dump tem {{ $value | printf "%.1f" }}h (limite: 26h).
            Verificar cron em /var/log/innova-backup.log no VPS.

      # Alerta se as métricas de backup deixarem de ser geradas
      # (sinal de que o cron de backup-metrics.sh parou)
      - alert: BackupMetricsStale
        expr: >
          (time() - innova_backup_metrics_generated_timestamp_seconds) > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Métricas de backup não actualizadas'
          description: >
            O script backup-metrics.sh não actualizou as métricas há mais de 30 minutos.
            Verificar o cron e o node-exporter textfile collector.

      # Alerta se o S3 de backup deixar de ser acessível
      - alert: BackupS3Unreachable
        expr: innova_backup_s3_reachable == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'S3 de backup inacessível'
          description: >
            O VPS não consegue aceder ao bucket S3 de backup há mais de 15 minutos.
            Verificar credenciais AWS e conectividade de rede.

      # O restauro de teste mensal (restore-drill.sh) deixou de passar ou de correr
      - alert: RestoreDrillTooOld
        expr: >
          (time() - innova_restore_drill_last_success_timestamp_seconds) / 86400 > 40
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Restauro de teste de backups em atraso'
          description: >
            O último restore drill bem-sucedido tem {{ $value | printf "%.0f" }} dias (limite: 40).
            Sem restauro provado, o backup é só uma esperança. Ver /var/log/innova-backup.log.

  # ─── Postgres (postgres-exporter) — lag, ligações, cache, deadlocks ───────
  - name: innova-postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Postgres inacessível pelo exporter'
          description: 'O exporter não consegue ligar-se ao Postgres há mais de 1 minuto.'

      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'postgres-exporter em baixo'
          description: 'Sem métricas do Postgres — alertas de lag e ligações ficam cegos.'

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Ligações Postgres acima de 80% ({{ $value | humanizePercentage }})'
          description: 'Perto do max_connections. Confirmar que a app usa o PgBouncer (DATABASE_POOLER_URL).'

      - alert: PostgresReplicationLagHigh
        expr: pg_replication_lag_seconds > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Lag de replicação {{ $value | printf "%.1f" }}s'
          description: 'Réplica atrasada. Leituras na réplica podem devolver dados antigos; considerar USE_REPLICAS=false.'

      - alert: PostgresReplicationLagCritical
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Lag de replicação crítico ({{ $value | printf "%.0f" }}s)'
          description: 'Desligar USE_REPLICAS e investigar a réplica / slot de replicação.'

      - alert: PostgresCacheHitLow
        expr: >
          sum(rate(pg_stat_database_blks_hit[10m]))
          / (sum(rate(pg_stat_database_blks_hit[10m])) + sum(rate(pg_stat_database_blks_read[10m]))) < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Cache hit ratio do Postgres abaixo de 95%'
          description: 'Falta RAM / shared_buffers, ou há scans sequenciais pesados.'

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Deadlocks no Postgres'
          description: 'Houve deadlocks nos últimos 10 minutos. Ver o log do Postgres.'
