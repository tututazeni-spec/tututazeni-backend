# Lê os ficheiros json-file do Docker directamente (sem montar docker.sock).
# O serviço compose vem no campo `attrs` porque o x-logging do compose pede
# `labels: com.docker.compose.service`.
server:
  http_listen_port: 9080
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            attrs: attrs
      - json:
          source: attrs
          expressions:
            service: '"com.docker.compose.service"'
      - labels:
          service:
          stream:
      - output:
          source: log
      # logs JSON da app (pino): promove o nível a label para filtrar erros
      - json:
          expressions:
            level: level
      - labels:
          level:
