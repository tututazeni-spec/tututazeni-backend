# Prometheus (regra 9) — scrape da app + avaliação das regras de alerta.
# O token do /metrics é gerado pelo deploy.sh a partir do .env.production
# (ficheiro monitoring/metrics_token, gitignored) — o guard fail-closed manda.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'innova-app'
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    # `app` é um serviço replicado (2+ réplicas, sem container_name). O DNS do
    # Docker devolve um A record por réplica — o SD resolve-os todos e cada
    # réplica vira um target distinto (instance = IP:4000). Assim um alerta
    # `up == 0` dispara por réplica, e vê-se a app a correr degradada numa só.
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 4000
        refresh_interval: 15s

  # Métricas do SO: disco, CPU, RAM, rede (B3-3)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
