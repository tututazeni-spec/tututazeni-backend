# Compose de produção — corre no VPS em /opt/innova (ver docs/deploy/runbook.md).
# Postgres NÃO está aqui: é gerido/externo (decisão em docs/db-architecture/).
# IMAGE_TAG vem do ambiente (deploy.sh exporta-o a partir de current_tag).
#
# Topologia da borda (pontos 2/4/9 da auditoria de arquitectura):
#   Cloudflare (WAF + CDN + anti-DDoS)  ──►  Caddy (TLS origin, load balancer)
#                                              ├──► app  (2 réplicas, round-robin)
#                                              └──► app
#   Ver docs/deploy/cloudflare.md e docs/deploy/ha-and-spof.md.
name: innova

services:
  # ─── Migrations: job one-shot que corre ANTES das réplicas da app ──────────
  # Tira o `prisma migrate deploy` do arranque de cada réplica — senão N
  # réplicas correriam a migração em paralelo (o advisory lock do Prisma
  # serializa-as, mas é frágil). Corre até terminar; `app` só arranca depois
  # de este job sair com código 0.
  migrate:
    image: ghcr.io/tututazeni-spec/tututazeni-backend:${IMAGE_TAG:-latest}
    container_name: innova-migrate
    env_file: .env.production
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  app:
    image: ghcr.io/tututazeni-spec/tututazeni-backend:${IMAGE_TAG:-latest}
    # SEM container_name: um nome fixo bloqueia `deploy.replicas` / `--scale`.
    # SEM porta publicada no host: 2 réplicas não podem partilhar a :4000.
    #   debug: `docker compose -f docker-compose.prod.yml exec app sh`
    #   ou:    `docker compose -f docker-compose.prod.yml run --rm \
    #             --service-ports -p 127.0.0.1:4000:4000 app`
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    # healthcheck herdado do HEALTHCHECK da imagem (GET /health/ready).
    # O Caddy faz balanceamento + tira da rotação a réplica que falhe o health.

  # ─── Frontend Next.js (ponto 3 — camada Next.js) ─────────────────────────
  # Imagem própria, construída pelo repo tututazeni-frontend e publicada no
  # GHCR. 2 réplicas pelo mesmo motivo do `app`: falha de processo não derruba
  # o site. Sem porta publicada (as réplicas partilhariam a :3000). O Caddy
  # encaminha `/` para aqui e `/api/*` para o `app`.
  frontend:
    image: ghcr.io/tututazeni-spec/tututazeni-frontend:${FRONTEND_IMAGE_TAG:-latest}
    env_file: .env.production # API_INTERNAL_URL
    environment:
      PORT: '3000'
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    # healthcheck herdado do HEALTHCHECK da imagem (GET /health).

  # ─── Borda TLS + Load Balancer (pontos 2/4) — única porta pública do VPS ───
  # Atrás da Cloudflare. O ufw só deixa entrar 80/443 dos ranges Cloudflare
  # (ops/deploy/origin-firewall.sh), portanto o Caddy nunca é alcançado
  # directamente pelo IP de origem — a WAF da Cloudflare não é contornável.
  caddy:
    image: caddy:2-alpine
    container_name: innova-caddy
    env_file: .env.production # DOMAIN para o Caddyfile
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/origin:/etc/caddy/origin:ro # cert Cloudflare Origin CA (cert.pem + key.pem)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - frontend
    restart: always
    stop_grace_period: 15s
    healthcheck:
      # A admin API do Caddy escuta em localhost:2019. Se o Caddy pendurar (não
      # morrer), o Docker reinicia-o em vez de esperar pelo exit do processo.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: innova-redis-prod
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ─── Monitorização (regra 9) — sem portas públicas; UI só via túnel SSH ───
  # Limites de memória (ponto 9): um pico do Prometheus/Alertmanager não pode
  # matar por OOM a borda Caddy nem as réplicas da app.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: innova-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./monitoring/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: innova-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Métricas do SO (disco, CPU, RAM, rede) — B3-3 ───────────────────────
  # Expõe métricas do host para o Prometheus. Sem porta pública — só acessível
  # internamente na rede Docker. Necessário para alertas de disco (DiskSpaceLow).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: innova-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Textfile collector: lê métricas de backup geradas por backup-metrics.sh e walg-backup.sh
      # O directório host é criado pelo install-cron.sh
      - '--collector.textfile.directory=/textfile_collector'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Métricas de backup escritas pelos scripts no VPS (fora do Docker)
      - /var/lib/node-exporter/textfile_collector:/textfile_collector:ro
    ports:
      - '127.0.0.1:9100:9100'
    pid: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  redis-data:
  prometheus-data:
  alertmanager-data:
  caddy-data:
  caddy-config:
