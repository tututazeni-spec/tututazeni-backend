apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: innova
resources:
  - config.yaml
  - app.yaml
  - frontend.yaml
  - ingress.yaml
  - policies.yaml
images:
  - name: ghcr.io/tututazeni-spec/tututazeni-backend
    newTag: stable # o pipeline substitui por sha-<commit>
  - name: ghcr.io/tututazeni-spec/tututazeni-frontend
    newTag: latest
# migrate.yaml fica fora de propósito: um Job é imutável e tem de correr antes do rollout.
