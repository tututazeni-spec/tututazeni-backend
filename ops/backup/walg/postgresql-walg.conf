# ============================================================
# INNOVA — Configuração do PostgreSQL para WAL-G
#
# Adicionar ao postgresql.conf (ou usar include_dir).
# Caminho típico: /etc/postgresql/16/main/conf.d/walg.conf
#
# Após editar: sudo systemctl restart postgresql
# Verificar: psql -c "SHOW archive_mode; SHOW wal_level;"
# ============================================================

# Nível de WAL necessário para archiving e replicação
wal_level = replica

# Activar archiving de WAL
archive_mode = on

# Comando de archiving — envia cada segmento WAL para o S3 via WAL-G
# O script source o walg.env para ter as credenciais AWS
archive_command = 'set -a; source /etc/walg/walg.env; set +a; wal-g wal-push %p >> /var/log/innova-walg.log 2>&1'

# Forçar switch do WAL segment após 60s (máximo de dados perdidos em caso de crash = 60s)
# Sem isto, segmentos pouco activos ficam em memória até 16MB antes de serem arquivados
archive_timeout = 60

# Comando para buscar WAL durante recovery (PITR)
restore_command = 'set -a; source /etc/walg/walg.env; set +a; wal-g wal-fetch %f %p'

# ── Tuning recomendado para produção com WAL archiving ────────
# Aumentar checkpoints reduz I/O de WAL em picos de escrita
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ── Retenção de WAL local (mínimo necessário para replica catch-up) ──
wal_keep_size = 1024  # MB — manter pelo menos 1GB de WAL local
