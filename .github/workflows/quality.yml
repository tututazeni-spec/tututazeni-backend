name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      postgres:
        image: postgres:16
        env:
          # Tem de coincidir com o DATABASE_URL do .env.test, que os testes
          # de integração carregam com override
          POSTGRES_PASSWORD: 'Placido*7'
          POSTGRES_DB: innova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Verificar lint
        run: npm run lint:check

      - name: Verificar formatação
        run: npm run format:check

      - name: Validar configuração de monitorização (regra 9)
        # Barato (~segundos). promtool valida config+regras; amtool valida o
        # template renderizado com valores dummy (envsubst existe no runner).
        run: |
          docker run --rm -v "$PWD/ops/monitoring/alert-rules.yml:/cfg/alert-rules.yml:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 check rules /cfg/alert-rules.yml
          echo dummy > /tmp/metrics_token
          docker run --rm \
            -v "$PWD/ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ops/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro" \
            -v /tmp/metrics_token:/etc/prometheus/secrets/metrics_token:ro \
            --entrypoint promtool prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
          SMTP_HOST=smtp.example.com SMTP_PORT=587 SMTP_USER=alerts@example.com \
          SMTP_PASSWORD=dummy ALERT_EMAIL_TO=ops@example.com \
          TELEGRAM_BOT_TOKEN=123456:dummy TELEGRAM_CHAT_ID=123456 \
          HEALTHCHECKS_PING_URL=https://hc-ping.com/dummy \
            envsubst < ops/monitoring/alertmanager.yml.tpl > /tmp/alertmanager.yml
          docker run --rm -v /tmp/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro \
            --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Build
        run: npm run build

      - name: Aplicar migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://postgres:Placido*7@localhost:5432/innova_test'

      - name: Cobertura de código
        run: npm run test:coverage
        env:
          DATABASE_URL: 'postgresql://postgres:Placido*7@localhost:5432/innova_test'

      - name: Testes de integração
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:Placido*7@localhost:5432/innova_test'
          JWT_SECRET: 'test-secret-key-innova-2024-must-be-long'
          JWT_REFRESH_SECRET: 'test-refresh-secret-innova-2024-long'
          ALLOWED_FILE_HOST: 'ci.innova.test'
          ALLOWED_ORIGINS: 'http://localhost:4000'
          APP_URL: 'http://localhost:4000'
          METRICS_TOKEN: 'ci-metrics-token'

      - name: Arrancar app para regressão
        run: node dist/main.js &
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:Placido*7@localhost:5432/innova_test'
          JWT_SECRET: 'test-secret-key-innova-2024-must-be-long'
          JWT_REFRESH_SECRET: 'test-refresh-secret-innova-2024-long'
          ALLOWED_FILE_HOST: 'ci.innova.test'
          ALLOWED_ORIGINS: 'http://localhost:4000'
          APP_URL: 'http://localhost:4000'
          METRICS_TOKEN: 'ci-metrics-token'
          PORT: '4000'

      - name: Esperar pela app (health/ready)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health/ready > /dev/null; then
              echo "✅ app pronta"; exit 0
            fi
            sleep 1
          done
          echo "❌ app não ficou pronta em 60s"; exit 1

      - name: Regressão de fluxos críticos
        run: npm run test:regression
        env:
          DATABASE_URL: 'postgresql://postgres:Placido*7@localhost:5432/innova_test'

      - name: Análise SonarCloud
        # Só corre se o segredo SONAR_TOKEN estiver configurado no repositório.
        # Sem isto, o passo falharia em repositórios sem SonarCloud ligado.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
