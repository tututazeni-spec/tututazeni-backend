name: Status Page

# Sonda externa (fora do VPS) + publicação da página de estado no branch `gh-pages`.
# Configuração (Settings → Secrets and variables → Actions → Variables):
#   STATUS_TARGETS = [{"id":"web","name":"Aplicação web","url":"https://<dominio>/"},
#                     {"id":"api","name":"API","url":"https://<dominio>/api/health/ready"}]
# Settings → Pages → Source: branch gh-pages. Ver docs/deploy/status-page.md.
# Incidentes: editar ops/status-page/incidents.json (via PR); o push em main republica a página.

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['ops/status-page/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Obter estado anterior (gh-pages)
        run: |
          mkdir site
          if git -C src ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C src fetch --depth=1 origin gh-pages
            git -C src --work-tree="$PWD/site" checkout FETCH_HEAD -- status.json 2>/dev/null || true
            git -C src reset -q
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sondar alvos
        env:
          STATUS_TARGETS: ${{ vars.STATUS_TARGETS }}
        run: node src/ops/status-page/probe.mjs site/status.json

      - name: Publicar em gh-pages
        run: |
          cp src/ops/status-page/index.html src/ops/status-page/incidents.json site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "status: $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
