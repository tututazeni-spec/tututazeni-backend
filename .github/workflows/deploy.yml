name: Deploy

# Fluxo: build+push da imagem → scan Trivy → [staging] → produção → health gate → smoke
# → se verde, a tag passa a `stable`; se vermelho, rollback automático.
#
# Modo de deploy (escolhido pelos secrets, por esta ordem):
#   1. SSH   — DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY: copia ops/ para /opt/innova e corre
#              deploy.sh (rolling, health gate por réplica). É o caminho descrito em
#              docs/deploy/runbook.md e o que o rollback.sh assume.
#   2. Webhook — DEPLOY_WEBHOOK_URL/ROLLBACK_WEBHOOK_URL: para plataformas geridas; o
#              receptor tem de publicar a tag recebida e repor `stable` no rollback.
#   Sem nenhum dos dois, só o build corre (e em PRs não há push).
# Staging (opcional): STAGING_HOST/STAGING_USER/STAGING_SSH_KEY/STAGING_SMOKE_BASE_URL.
# Se existir, a produção só avança depois de o staging passar health gate + smoke.
# Frontend: o repo tututazeni-frontend dispara `repository_dispatch: frontend-updated`
# (client_payload.tag) → redeploy só do frontend, com a tag do backend já em produção.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'ops/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente no GHCR a fazer deploy (ex. sha-abc123). Vazio = build do commit actual.'
        required: false
        default: ''
  repository_dispatch:
    types: [frontend-updated]

# Mínimo por omissão; os jobs que precisam de mais (packages: write) declaram-no.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('sha-{0}', github.sha) }}
  # Ficheiros copiados para /opt/innova (strip_components 1: ops/deploy/x → /opt/innova/deploy/x)
  DEPLOY_FILES: ops/docker-compose.prod.yml,ops/caddy/Caddyfile,ops/deploy/deploy.sh,ops/deploy/rollback.sh,ops/deploy/origin-firewall.sh,ops/deploy/caddy-watchdog.sh,ops/deploy/rollback-drill.sh,ops/deploy/bootstrap-vps.sh,ops/monitoring/prometheus.yml,ops/monitoring/alert-rules.yml,ops/monitoring/alertmanager.yml.tpl,ops/monitoring/loki.yml,ops/monitoring/promtail.yml,ops/monitoring/grafana,ops/backup/backup-postgres.sh,ops/backup/restore-postgres.sh,ops/backup/verify-backup.sh,ops/backup/restore-drill.sh,ops/backup/backup-secrets.sh,ops/backup/backup-metrics.sh,ops/backup/install-cron.sh,ops/dr/DISASTER-RECOVERY.md

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
      mode: ${{ steps.check.outputs.mode }}
      staging: ${{ steps.check.outputs.staging }}
    steps:
      - id: check
        env:
          HAS_SSH: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
          HAS_STAGING: ${{ secrets.STAGING_HOST != '' }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          mode=none
          if [ "$IS_PR" != "true" ]; then
            if [ "$HAS_SSH" = "true" ]; then mode=ssh
            elif [ "$HAS_WEBHOOK" = "true" ]; then mode=webhook; fi
          fi
          # o frontend só se faz deploy por SSH (o webhook só conhece a imagem do backend)
          if [ "$mode" != "ssh" ] && [ "${{ github.event_name }}" = "repository_dispatch" ]; then mode=none; fi
          {
            echo "mode=$mode"
            echo "can_deploy=$([ "$mode" != none ] && echo true || echo false)"
            echo "staging=$([ "$mode" = ssh ] && [ "$HAS_STAGING" = "true" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "modo de deploy: $mode"

  build:
    runs-on: ubuntu-latest
    # dispatch com tag explícita ou do frontend → não reconstrói o backend
    if: ${{ github.event.inputs.tag == '' && github.event_name != 'repository_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push fora de PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bloqueia o deploy se a imagem trouxer CVE crítica com correção disponível
      # (base node:20-slim + dependências). Só em push: em PR a imagem não é publicada.
      # Imagem oficial do Trivy a correr directamente (sem depender de actions de terceiros,
      # que já falharam por referenciarem tags inexistentes).
      - name: Scan de vulnerabilidades (Trivy)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SCAN_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.58.1             image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$SCAN_IMAGE"

  # Ensaio geral: mesmo compose, mesmo deploy.sh, BD e domínio próprios (outro VPS).
  # Apanha migrations partidas e config em falta antes de tocarem em produção.
  staging:
    runs-on: ubuntu-24.04
    needs: [preflight, build]
    if: >-
      ${{ !cancelled() &&
          needs.preflight.outputs.staging == 'true' &&
          needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Copiar artefactos para o staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: ${{ env.DEPLOY_FILES }}
          target: /opt/innova
          strip_components: 1
          overwrite: true

      - name: Deploy no staging (deploy.sh)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_TAG,GHCR_TOKEN,GHCR_USER
          script: |
            case "$DEPLOY_TAG" in
              *[!a-zA-Z0-9._-]*|'') echo "Tag invalida"; exit 1 ;;
            esac
            chmod +x /opt/innova/deploy/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            /opt/innova/deploy/deploy.sh "$DEPLOY_TAG"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Smoke no staging
        run: npm run test:regression
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_SMOKE_BASE_URL }}
          SMOKE_SEED: 'false'
          SMOKE_ALLOW_WRITES: 'false'
          SMOKE_EMPLOYEE_EMAIL: ${{ secrets.STAGING_SMOKE_EMPLOYEE_EMAIL }}
          SMOKE_EMPLOYEE_PASSWORD: ${{ secrets.STAGING_SMOKE_EMPLOYEE_PASSWORD }}
          SMOKE_RH_EMAIL: ${{ secrets.STAGING_SMOKE_RH_EMAIL }}
          SMOKE_RH_PASSWORD: ${{ secrets.STAGING_SMOKE_RH_PASSWORD }}
          SMOKE_COURSE_ID: ${{ secrets.STAGING_SMOKE_COURSE_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: [preflight, build, staging]
    if: >-
      ${{ !cancelled() &&
          needs.preflight.outputs.can_deploy == 'true' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.preflight.outputs.mode == 'ssh' }}

      - name: Copiar artefactos de deploy para o VPS
        if: ${{ needs.preflight.outputs.mode == 'ssh' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ${{ env.DEPLOY_FILES }}
          target: /opt/innova
          strip_components: 1
          overwrite: true

      - name: Deploy no VPS (deploy.sh, rolling com health gate)
        if: ${{ needs.preflight.outputs.mode == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_TAG,FRONTEND_TAG,EVENT,GHCR_TOKEN,GHCR_USER
          script: |
            # redeploy do frontend: mantém a tag do backend que já corre
            if [ "$EVENT" = "repository_dispatch" ]; then
              DEPLOY_TAG="$(cat /opt/innova/current_tag)"
              case "$FRONTEND_TAG" in *[!a-zA-Z0-9._-]*|'') echo "Tag do frontend invalida"; exit 1 ;; esac
              export FRONTEND_TAG
            fi
            case "$DEPLOY_TAG" in
              *[!a-zA-Z0-9._-]*|'') echo "Tag invalida"; exit 1 ;;
            esac
            chmod +x /opt/innova/deploy/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            /opt/innova/deploy/deploy.sh "$DEPLOY_TAG"
        env:
          EVENT: ${{ github.event_name }}
          FRONTEND_TAG: ${{ github.event.client_payload.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Pedir o deploy à plataforma (webhook)
        if: ${{ needs.preflight.outputs.mode == 'webhook' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          case "$DEPLOY_TAG" in
            *[!a-zA-Z0-9._-]*|'') echo "Tag invalida"; exit 1 ;;
          esac
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            -d "{\"tag\":\"$DEPLOY_TAG\"}" "$DEPLOY_WEBHOOK_URL"
          echo "deploy pedido para $DEPLOY_TAG"

      - name: Esperar que a nova versão responda (GET /health/ready)
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          [ -n "$SMOKE_BASE_URL" ] || { echo "SMOKE_BASE_URL não definido — sem health gate"; exit 1; }
          sha="${DEPLOY_TAG#sha-}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SMOKE_BASE_URL/health/ready" || true)
            ver=$(curl -s --max-time 10 "$SMOKE_BASE_URL/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "tentativa $i: ready=$code version=$ver"
            # BUILD_SHA 'unknown' = plataforma que não injecta o commit; num redeploy só do
            # frontend a versão do backend não muda, por isso só o ready conta
            if [ "$code" = "200" ] && { [ "$ver" = "$sha" ] || [ "$ver" = "unknown" ] || [ "$EVENT" = "repository_dispatch" ]; }; then
              exit 0
            fi
            sleep 10
          done
          echo "a nova versão não ficou pronta a tempo"; exit 1

  verify:
    runs-on: ubuntu-24.04
    needs: [preflight, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar frontend (GET /)
        run: |
          base="$SMOKE_FRONTEND_URL"
          [ -n "$base" ] || { echo "SMOKE_FRONTEND_URL não definido — a saltar"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$base/")
          echo "GET $base/ → $code"
          case "$code" in
            2??|3??) echo "frontend OK" ;;
            *) echo "frontend não respondeu OK"; exit 1 ;;
          esac
        env:
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}

      - name: Smoke pós-deploy (suite da regra 8 contra produção)
        run: npm run test:regression
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_SEED: 'false'
          SMOKE_ALLOW_WRITES: 'false'
          SMOKE_EMPLOYEE_EMAIL: ${{ secrets.SMOKE_EMPLOYEE_EMAIL }}
          SMOKE_EMPLOYEE_PASSWORD: ${{ secrets.SMOKE_EMPLOYEE_PASSWORD }}
          SMOKE_RH_EMAIL: ${{ secrets.SMOKE_RH_EMAIL }}
          SMOKE_RH_PASSWORD: ${{ secrets.SMOKE_RH_PASSWORD }}
          SMOKE_COURSE_ID: ${{ secrets.SMOKE_COURSE_ID }}

      # `stable` = última release verificada (alvo do rollback por webhook). Um redeploy só
      # do frontend não muda a imagem do backend, por isso não a move.
      - name: Marcar a imagem como `stable`
        if: ${{ success() && github.event_name != 'repository_dispatch' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$DEPLOY_TAG"
          echo "stable → $DEPLOY_TAG"

  rollback:
    runs-on: ubuntu-latest
    needs: [preflight, deploy, verify]
    if: >-
      ${{ !cancelled() &&
          needs.preflight.outputs.can_deploy == 'true' &&
          (needs.deploy.result == 'failure' || needs.verify.result == 'failure') }}
    steps:
      - name: Rollback automático (rollback.sh no VPS)
        if: ${{ needs.preflight.outputs.mode == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: /opt/innova/deploy/rollback.sh

      - name: Rollback automático (webhook → stable)
        if: ${{ needs.preflight.outputs.mode == 'webhook' }}
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.ROLLBACK_WEBHOOK_URL }}
        run: |
          [ -n "$ROLLBACK_WEBHOOK_URL" ] || { echo "ROLLBACK_WEBHOOK_URL não definido — rollback impossível"; exit 1; }
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            -d '{"tag":"stable"}' "$ROLLBACK_WEBHOOK_URL"
          echo "rollback pedido para a tag stable"

  notify:
    runs-on: ubuntu-latest
    needs: [preflight, deploy, verify, rollback]
    if: ${{ always() && needs.preflight.outputs.can_deploy == 'true' }}
    steps:
      - name: Notificar resultado por Telegram (opcional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram não configurado — a saltar notificação"; exit 0
          fi
          if [ "$ROLLBACK_RESULT" = "success" ]; then
            MSG="⚠️ INNOVA: deploy de ${GITHUB_SHA::7} falhou — ROLLBACK automático executado com sucesso."
          elif [ "$ROLLBACK_RESULT" = "failure" ]; then
            MSG="🔥 INNOVA: deploy de ${GITHUB_SHA::7} falhou E o rollback automático FALHOU — intervenção manual necessária."
          elif [ "$DEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then
            MSG="✅ INNOVA: deploy de ${GITHUB_SHA::7} concluído e verificado (smoke verde)."
          else
            MSG="ℹ️ INNOVA: workflow de deploy terminou (deploy=$DEPLOY_RESULT, verify=$VERIFY_RESULT)."
          fi
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" > /dev/null
          echo "notificação enviada"
