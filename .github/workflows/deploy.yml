name: Deploy

# Regra 10: deploy com monitorização e rollback automático.
# Sem VPS: o destino de produção ainda não está decidido, por isso o workflow é
# agnóstico da plataforma e só fala com ela por dois webhooks opcionais:
#   DEPLOY_WEBHOOK_URL    → recebe POST {"tag": "sha-<commit>"} e deve publicar essa imagem
#   ROLLBACK_WEBHOOK_URL  → recebe POST {"tag": "stable"} e deve voltar à última release verificada
# Fluxo: build+push da imagem → deploy (webhook) → smoke contra SMOKE_BASE_URL
# → se verde, a tag passa a `stable`; se vermelho, rollback automático para `stable`.
# Sem os secrets, só o build corre (e em PRs não há push). Ver docs/deploy/.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente no GHCR a fazer deploy (ex. sha-abc123). Vazio = build do commit actual.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - id: check
        run: echo "can_deploy=${{ secrets.DEPLOY_WEBHOOK_URL != '' && github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    # dispatch com tag explícita → não reconstrói, faz deploy dessa tag
    if: ${{ github.event.inputs.tag == '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (push fora de PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: >-
      ${{ !cancelled() &&
          needs.preflight.outputs.can_deploy == 'true' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    steps:
      - name: Pedir o deploy à plataforma (webhook)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          case "$DEPLOY_TAG" in
            *[!a-zA-Z0-9._-]*|'') echo "Tag invalida"; exit 1 ;;
          esac
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json'             -d "{\"tag\":\"$DEPLOY_TAG\"}" "$DEPLOY_WEBHOOK_URL"
          echo "deploy pedido para $DEPLOY_TAG"

      - name: Esperar que a nova versão responda (GET /health/ready)
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          DEPLOY_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          [ -n "$SMOKE_BASE_URL" ] || { echo "SMOKE_BASE_URL não definido — sem health gate"; exit 1; }
          sha="${DEPLOY_TAG#sha-}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SMOKE_BASE_URL/health/ready" || true)
            ver=$(curl -s --max-time 10 "$SMOKE_BASE_URL/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "tentativa $i: ready=$code version=$ver"
            # BUILD_SHA 'unknown' = plataforma que não injecta o commit: só o ready conta
            if [ "$code" = "200" ] && { [ "$ver" = "$sha" ] || [ "$ver" = "unknown" ]; }; then
              exit 0
            fi
            sleep 10
          done
          echo "a nova versão não ficou pronta a tempo"; exit 1

  verify:
    runs-on: ubuntu-latest
    needs: [preflight, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar frontend (GET /)
        run: |
          base="$SMOKE_FRONTEND_URL"
          [ -n "$base" ] || { echo "SMOKE_FRONTEND_URL não definido — a saltar"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$base/")
          echo "GET $base/ → $code"
          case "$code" in
            2??|3??) echo "frontend OK" ;;
            *) echo "frontend não respondeu OK"; exit 1 ;;
          esac
        env:
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}

      - name: Smoke pós-deploy (suite da regra 8 contra produção)
        run: npm run test:regression
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_SEED: 'false'
          SMOKE_ALLOW_WRITES: 'false'
          SMOKE_EMPLOYEE_EMAIL: ${{ secrets.SMOKE_EMPLOYEE_EMAIL }}
          SMOKE_EMPLOYEE_PASSWORD: ${{ secrets.SMOKE_EMPLOYEE_PASSWORD }}
          SMOKE_RH_EMAIL: ${{ secrets.SMOKE_RH_EMAIL }}
          SMOKE_RH_PASSWORD: ${{ secrets.SMOKE_RH_PASSWORD }}
          SMOKE_COURSE_ID: ${{ secrets.SMOKE_COURSE_ID }}

      - name: Marcar a imagem como `stable` (alvo do rollback)
        if: ${{ success() }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$DEPLOY_TAG"
          echo "stable → $DEPLOY_TAG"

  rollback:
    runs-on: ubuntu-latest
    needs: [preflight, deploy, verify]
    if: >-
      ${{ !cancelled() &&
          needs.preflight.outputs.can_deploy == 'true' &&
          (needs.deploy.result == 'failure' || needs.verify.result == 'failure') }}
    steps:
      - name: Rollback automático para a última release verificada (stable)
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.ROLLBACK_WEBHOOK_URL }}
        run: |
          [ -n "$ROLLBACK_WEBHOOK_URL" ] || { echo "ROLLBACK_WEBHOOK_URL não definido — rollback impossível"; exit 1; }
          curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json'             -d '{"tag":"stable"}' "$ROLLBACK_WEBHOOK_URL"
          echo "rollback pedido para a tag stable"

  notify:
    runs-on: ubuntu-latest
    needs: [preflight, deploy, verify, rollback]
    if: ${{ always() && needs.preflight.outputs.can_deploy == 'true' }}
    steps:
      - name: Notificar resultado por Telegram (opcional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram não configurado — a saltar notificação"; exit 0
          fi
          if [ "$ROLLBACK_RESULT" = "success" ]; then
            MSG="⚠️ INNOVA: deploy de ${GITHUB_SHA::7} falhou — ROLLBACK automático executado com sucesso."
          elif [ "$ROLLBACK_RESULT" = "failure" ]; then
            MSG="🔥 INNOVA: deploy de ${GITHUB_SHA::7} falhou E o rollback automático FALHOU — intervenção manual necessária."
          elif [ "$DEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then
            MSG="✅ INNOVA: deploy de ${GITHUB_SHA::7} concluído e verificado (smoke verde)."
          else
            MSG="ℹ️ INNOVA: workflow de deploy terminou (deploy=$DEPLOY_RESULT, verify=$VERIFY_RESULT)."
          fi
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" > /dev/null
          echo "notificação enviada"
